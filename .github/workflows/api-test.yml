name: API Regression Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Newmanと、Allure用の報告パーツをインストールする
      - name: Install Newman and Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-allure

      # 4. テストを実行し、結果を「allure-results」というフォルダに保存する
      - name: Run API Tests
        run: newman run tests/api/MyTest.postman_collection.json -r allure
        continue-on-error: true # ←「テストが失敗しても、次のレポート作成に進んでね！」という魔法

      # 5. 【重要】保存した結果を、オシャレなHTMLレポート（allure-report）に変換する
      - name: Generate Allure Report
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      # 6. 掲示板（GitHub Pages）に貼り出す
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report